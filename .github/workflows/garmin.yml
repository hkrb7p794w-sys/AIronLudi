# AIronLudi-Karte (Connect-IQ-Datenfeld für Garmin-Uhren, Ordner garmin/): strenge Typprüfung und Build.
#
# Gerätedateien: Mit den Secrets GARMIN_USERNAME und GARMIN_PASSWORD (am besten ein eigenes Garmin-Konto nur dafür,
# ohne Zwei-Faktor-Anmeldung) und der Variable CIQ_AGREEMENT_HASH (Garmins SDK-Lizenz, selbst gelesen und bestätigt;
# fehlt sie, steht der aktuelle Hash in der Zusammenfassung des Laufs) lädt der Lauf Garmins offizielle Gerätedateien.
# Ohne sie nimmt er die minimale Beschreibung aus garmin/ci/devices: strenge Typprüfung und eine Testversion.
# Schlüssel: Secret CIQ_DEVELOPER_KEY (DER, Base64); ohne Secret ein Wegwerf-Schlüssel (reicht zum Prüfen).
# Worker-Adresse: Variable WATCH_WORKER_URL (wird beim Build in garmin/source/WorkerConfig.mc eingesetzt).
name: Garmin

on:
  pull_request:
    paths: ["garmin/**", ".github/workflows/garmin.yml"]
  push:
    branches: [main]
    paths: ["garmin/**", ".github/workflows/garmin.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CIQ_SDK: connectiq-sdk-lin-9.3.0-2026-10-20-95888f262.zip
  DEVICES: fr265 fr265s
  CIQ_MANAGER: v0.8.4

jobs:
  garmin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
      GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
      CIQ_DEVELOPER_KEY: ${{ secrets.CIQ_DEVELOPER_KEY }}
      CIQ_AGREEMENT_HASH: ${{ vars.CIQ_AGREEMENT_HASH }}
      WATCH_WORKER_URL: ${{ vars.WATCH_WORKER_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Connect-IQ-SDK laden
        run: |
          curl -fsSL -o sdk.zip "https://developer.garmin.com/downloads/connect-iq/sdks/$CIQ_SDK"
          unzip -q sdk.zip -d "$HOME/ciq-sdk"
          echo "$HOME/ciq-sdk/bin" >> "$GITHUB_PATH"

      - name: Gerätedateien
        id: devices
        run: |
          mkdir -p "$HOME/.Garmin/ConnectIQ/Devices"
          # Werkzeug für Garmins Gerätedateien, feste Version (github.com/lindell/connect-iq-sdk-manager-cli).
          curl -fsSL "https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/$CIQ_MANAGER/install.sh" \
            | sh -s -- -b "$HOME/bin" "$CIQ_MANAGER"
          # Das Skript legt das Programm als „connect-iq-sdk-manager“ ab (ohne „-cli“).
          cli="$HOME/bin/connect-iq-sdk-manager"
          "$cli" version
          if [ -z "$CIQ_AGREEMENT_HASH" ]; then
            # Nur anzeigen, nichts bestätigen: Lizenz-Link und aktueller Hash in die Zusammenfassung des Laufs.
            # Ausgabe ins Protokoll, damit ein Fehler beim Abrufen sichtbar bleibt.
            view=$("$cli" agreement view 2>&1 || true)
            echo "$view"
            hash=$(echo "$view" | sed -n 's/^Current Hash: //p')
            {
              echo "### Garmin-SDK-Lizenz"
              echo
              echo "Für Garmins offizielle Gerätedateien muss die Lizenz bestätigt sein. Lies sie hier:"
              echo "https://developer.garmin.com/downloads/connect-iq/sdks/agreement.html"
              echo
              echo "Bist du einverstanden, trag diesen Wert als Repo-Variable \`CIQ_AGREEMENT_HASH\` ein:"
              echo
              echo "\`\`\`"
              echo "${hash:-(nicht abrufbar – Lauf später wiederholen)}"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$GARMIN_USERNAME" ] && [ -n "$GARMIN_PASSWORD" ] && [ -n "$CIQ_AGREEMENT_HASH" ]; then
            "$cli" agreement accept --agreement-hash="$CIQ_AGREEMENT_HASH"
            if ! "$cli" login; then
              echo "::error::Garmin-Anmeldung fehlgeschlagen. Passwort prüfen; Konten mit Zwei-Faktor-Anmeldung gehen nicht (docs/einrichtung.md)."
              exit 1
            fi
            "$cli" device download --manifest=garmin/manifest.xml
            echo "official=true" >> "$GITHUB_OUTPUT"
          else
            cp -r garmin/ci/devices/* "$HOME/.Garmin/ConnectIQ/Devices/"
            echo "::notice::Ohne Garmin-Zugang: Testversion mit minimaler Gerätebeschreibung (docs/einrichtung.md)."
            echo "official=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Schlüssel und Worker-Adresse
        run: |
          if [ -n "$CIQ_DEVELOPER_KEY" ]; then
            echo "$CIQ_DEVELOPER_KEY" | base64 -d > "$RUNNER_TEMP/developer.der"
          else
            openssl genrsa -out "$RUNNER_TEMP/developer.pem" 4096
            openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/developer.pem" -out "$RUNNER_TEMP/developer.der" -nocrypt
          fi
          if [ -n "$WATCH_WORKER_URL" ]; then
            sed -i "s#__WORKER_URL__#${WATCH_WORKER_URL%/}#" garmin/source/WorkerConfig.mc
            echo "::notice::Worker-Adresse eingetragen."
            echo "Worker-Adresse: eingetragen" >> "$GITHUB_STEP_SUMMARY"
          else
            # Ohne Adresse zeigt das Datenfeld „Worker-Adresse fehlt“.
            echo "::warning::Variable WATCH_WORKER_URL fehlt – das Datenfeld zeigt „Worker-Adresse fehlt“ (docs/einrichtung.md)."
            echo "Worker-Adresse: **fehlt** (Variable \`WATCH_WORKER_URL\` anlegen und neu bauen)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Typprüfung und Build
        run: |
          mkdir -p build
          for device in $DEVICES; do
            monkeyc -f garmin/monkey.jungle -d "$device" -y "$RUNNER_TEMP/developer.der" \
              -o "build/AIronLudiKarte-$device.prg" -l 3 -w 2>&1 | tee "build/$device.log"
            if grep -q "WARNING\|ERROR" "build/$device.log"; then
              echo "::error::Warnungen oder Fehler beim Build für $device"
              exit 1
            fi
          done

      - name: Paket für den Connect-IQ-Store
        if: steps.devices.outputs.official == 'true'
        run: monkeyc -e -f garmin/monkey.jungle -y "$RUNNER_TEMP/developer.der" -o build/AIronLudiKarte.iq -r

      - uses: actions/upload-artifact@v7
        with:
          # Ohne Garmin-Zugang eine Testversion (minimale Gerätebeschreibung) – zum Ausprobieren auf eigene Gefahr.
          name: ${{ steps.devices.outputs.official == 'true' && 'aironludi-karte' || 'aironludi-karte-test' }}
          path: build/*.prg
          retention-days: 14
