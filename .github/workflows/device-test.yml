# Gerätetests: die echte App auf Android-Emulator und iOS-Simulator (integration_test/device_test.dart). Prüft, was nur
# das Betriebssystem zeigt: echter Start, Datenbank, Ordner, Schlüsselbund, native Brücken, Benutzerwechsel mit Dateien.
#
# - Pull Request: Label „device-test“ setzen; danach läuft er bei jedem Push des PRs erneut.
# - „Run workflow“ und wöchentlich am Montag.
# Bildschirmfotos liegen als Artefakt am Lauf.
name: Device Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: device-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'device-test')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: KVM freigeben (schneller Emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gerätetest im Emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/screenshots/android
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/device_test.dart -d emulator-5554

      - name: Bildschirmfotos
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: device-android
          path: screenshots/android
          if-no-files-found: ignore

  ios:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'device-test')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      XCODE_MAJOR: "26"
      SCREENSHOT_DIR: ${{ github.workspace }}/screenshots/ios
    steps:
      - uses: actions/checkout@v7

      - name: Xcode wählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_"$XCODE_MAJOR"*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: iPhone-Simulator starten
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Gerätetest im Simulator
        run: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/device_test.dart -d "$UDID"

      - name: Bildschirmfotos
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: device-ios
          path: screenshots/ios
          if-no-files-found: ignore
