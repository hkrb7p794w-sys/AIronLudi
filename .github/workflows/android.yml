# Android-APK der Flutter-App (Linux-Runner, Android-SDK vorinstalliert).
#
# - Pull Request und main: Release-APK als Artefakt.
# - Bereitstellung über den Worker (Workers KV, private Download-Seite der bisherigen Android-App) erst, wenn die
#   Repo-Variable DEPLOY_ANDROID auf "true" steht. So ersetzt kein halbfertiger Stand der Migration die genutzte
#   Kotlin-App. Gleiche Application-ID und gleicher Schlüssel (Secrets ANDROID_KEYSTORE_B64/_PASSWORD): Android
#   installiert die Flutter-App dann als Update.
name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Signaturschlüssel
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ironludi.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ironludi.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 fehlt – APK nur mit Debug-Signatur, keine Bereitstellung"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: APK bauen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          flutter build apk --release --build-number="$((10000 + BUILD_NUMBER))" --build-name="2.0.$BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/build.log"
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"
          SIZE=$(stat -c %s "$APK")
          # Workers KV nimmt höchstens 25 MiB je Wert.
          if [ "$SIZE" -gt 26000000 ]; then echo "::notice::APK größer als 25 MiB ($SIZE Bytes) – Bereitstellung über das private Release-Repo (RELEASES_TOKEN)"; fi
          echo "APK_SIZE=$SIZE" >> "$GITHUB_ENV"
          cp "$APK" "$RUNNER_TEMP/AIronLudi.apk"

      - name: APK als Artefakt
        uses: actions/upload-artifact@v7
        with:
          name: AIronLudi-${{ github.run_number }}
          path: ${{ runner.temp }}/AIronLudi.apk
          retention-days: 14

      - name: Fehler als PR-Kommentar
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || echo "Kein Build-Protokoll (Fehler vor dem Build, siehe Actions)." > "$LOG"
          {
            echo "❌ Android-Build $GITHUB_RUN_NUMBER fehlgeschlagen"
            echo
            echo '```'
            grep -E "^e: |error:|Error:|FAILED|What went wrong|Could not|Exception" -A3 "$LOG" | head -c 60000 || tail -n 80 "$LOG"
            echo '```'
          } > comment.md
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md > /dev/null

      - name: Bereitstellen (privates Release-Repo bzw. Workers KV, private Download-Seite)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.SIGNED == 'true' && vars.DEPLOY_ANDROID == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID: 103715a4f0004a398c9e75637a2edf36
          BUILD_NUMBER: ${{ github.run_number }}
          # Fine-grained Token mit „Contents: Read and write“ nur für das private Repo (docs/einrichtung.md).
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO || format('{0}/aironludi-releases', github.repository_owner) }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare-Secrets fehlen – keine Bereitstellung"
            exit 0
          fi
          APK="$RUNNER_TEMP/AIronLudi.apk"
          TAG="v2.0.$BUILD_NUMBER"
          ASSET_ID=""
          if [ -n "$RELEASES_TOKEN" ]; then
            # Universelle APK (alle Prozessortypen) als Release im privaten Repo; KV nimmt höchstens 25 MiB je Wert.
            GH_TOKEN="$RELEASES_TOKEN" gh release create "$TAG" "$APK" --repo "$RELEASES_REPO" \
              --title "AIronLudi $TAG (Android)" --notes "Commit ${GITHUB_SHA::7}, Build $BUILD_NUMBER." --latest
            ASSET_ID=$(GH_TOKEN="$RELEASES_TOKEN" gh api "repos/$RELEASES_REPO/releases/tags/$TAG" \
              --jq '.assets[] | select(.name == "AIronLudi.apk") | .id')
            [ -n "$ASSET_ID" ] || { echo "::error::APK im Release nicht gefunden"; exit 1; }
          elif [ "$APK_SIZE" -gt 26000000 ]; then
            echo "::error::APK zu groß für Workers KV – Secret RELEASES_TOKEN und privates Repo $RELEASES_REPO einrichten (docs/einrichtung.md)"
            exit 1
          fi
          python3 - "$APK" "$RELEASES_REPO" "$ASSET_ID" <<'PY'
          import datetime, json, os, sys
          build = int(os.environ["BUILD_NUMBER"])
          info = {
              "versionName": f"2.0.{build}",
              "versionCode": 10000 + build,
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "size": os.path.getsize(sys.argv[1]),
          }
          if sys.argv[3]:
              info["asset"] = {"repo": sys.argv[2], "id": int(sys.argv[3])}
          json.dump(info, open("android.json", "w", encoding="utf-8"))
          PY
          cat android.json
          WRANGLER="npx --yes wrangler@4.152.0"
          if [ -z "$ASSET_ID" ]; then
            $WRANGLER kv key put --namespace-id "$KV_ID" --remote android.apk --path "$APK"
          fi
          # Zuletzt die Versionsangaben, damit die Seite nie auf eine fehlende APK zeigt.
          $WRANGLER kv key put --namespace-id "$KV_ID" --remote android.json --path android.json
          if [ -n "$ASSET_ID" ]; then
            # Nur die letzten drei Versionen behalten (Rückweg bei einem fehlerhaften Update).
            GH_TOKEN="$RELEASES_TOKEN" gh release list --repo "$RELEASES_REPO" --limit 100 --json tagName \
              --jq '.[3:][] | .tagName' | while read -r old; do
              GH_TOKEN="$RELEASES_TOKEN" gh release delete "$old" --repo "$RELEASES_REPO" --yes --cleanup-tag
            done
          fi
